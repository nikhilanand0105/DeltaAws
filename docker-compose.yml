services:
  app:
    image: delta-bot-app
    build:
      context: .
      dockerfile: Dockerfile
    container_name: delta-bot-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - FLASK_APP=app.py
      - PYTHONUNBUFFERED=1
      - PORT=5000
    volumes:
      - ./instance:/app/instance
    networks:
      - delta-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: delta-bot-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - delta-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  delta-net:
    driver: bridge
