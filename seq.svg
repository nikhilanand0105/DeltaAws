  <rect x="30" y="100.44999999999999" width="152.29" height="18" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="36" y="109.44999999999999" font-size="11" font-weight="600" fill="var(--_text-sec)" dy="3.8499999999999996">loop [Every 5-10 Seconds]</text>
</g>
